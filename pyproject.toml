[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "production-rag-engine"
version = "0.1.0"
description = "Production-style RAG engine: structure-aware chunking, hybrid retrieval, reranking, cited answers, and reproducible retrieval evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "miguelzzzzzzzz" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pypdf>=4.2",
]

[project.urls]
Homepage = "https://github.com/miguelzzzzzzzz/CitationNeeded"
Repository = "https://github.com/miguelzzzzzzzz/CitationNeeded"
Issues = "https://github.com/miguelzzzzzzzz/CitationNeeded/issues"
Changelog = "https://github.com/miguelzzzzzzzz/CitationNeeded/blob/main/CHANGELOG.md"

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
rag-engine = "rag_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_engine"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pypdf.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that download models or datasets (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["rag_engine"]
branch = true
