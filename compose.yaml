# Build an index from ./corpus, then serve it:
#   docker compose run --rm index
#   docker compose up -d api
# The API mounts the index read-only; rebuild the index and restart api to reload.
# The API has no authentication, so it is published on 127.0.0.1 only; put an
# authenticating reverse proxy in front of it before exposing it further.
services:
  api:
    build: .
    image: citation-needed:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Load models at startup instead of on the first request: off | embedder | all.
      RAG_WARMUP: ${RAG_WARMUP:-off}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      # Optional OpenAI-compatible generator for POST /answer; empty = extractive only.
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    volumes:
      - rag-index:/data/index:ro
      - rag-models:/data/models
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  index:
    profiles: ["tools"]
    build: .
    image: citation-needed:local
    command:
      - rag-engine
      - index
      - /corpus
      - --out
      - /data/index
      - --embedder
      - ${RAG_INDEX_EMBEDDER:-fastembed}
      - --corpus-id
      - ${RAG_CORPUS_ID:-corpus}
    volumes:
      - ${RAG_CORPUS_DIR:-./corpus}:/corpus:ro
      - rag-index:/data/index
      - rag-models:/data/models

volumes:
  rag-index:
  rag-models:
